name: relay
on: [push]
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download from Google Drive
        run: |
          set -euxo pipefail
          pip install -q gdown
          mkdir -p dist
          cd dist
          gdown "https://drive.google.com/uc?id=17nSfJoOPtXWxmRbchFvMV9L5tNZHwroy" || echo failed
          ls -la
      - name: Extract code-only bundle
        run: |
          set -euxo pipefail
          cd dist
          T=faers_toolkit.tar.gz
          tar xzf "$T" --exclude='faers_toolkit/pv_analytics.duckdb'
          du -sh faers_toolkit
          find faers_toolkit -type f | sort
          tar czf faers_toolkit_code_only.tar.gz faers_toolkit
          ls -la faers_toolkit_code_only.tar.gz
          md5sum faers_toolkit_code_only.tar.gz
      - name: Upload code bundle
        run: |
          set -x
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          cd dist
          gh release view assets-v1 >/dev/null 2>&1 || gh release create assets-v1 --title "gdrive assets" --notes "relay"
          timeout 300 gh release upload assets-v1 faers_toolkit_code_only.tar.gz --clobber && echo OK || echo FAILED
